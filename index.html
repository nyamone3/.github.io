<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        /* 全体のリセットと中央配置の設定 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        /* コンテンツを囲むカードのデザイン */
        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
            padding: 40px 20px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        /* レスポンシブ対応の文字サイズ調整 */
        h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: #111111;
        }
        p {
            font-size: 1.1rem;
            color: #666666;
            line-height: 1.6;
        }
        /* 画面サイズが小さい（スマホなど）ときの調整 */
        @media (max-width: 480px) {
            h1 {
                font-size: 2.2rem;
            }
            p {
                font-size: 1rem;
            }
            .container {
                padding: 30px 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Coming Soon</h1>
        <p>ただいま新しいWebサイトを準備中です。<br>公開まで今しばらくお待ちください。</p>
    </div>

</body>
</html>
